<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>YTSpoofingStream</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="hdr">
    <div class="hdr-left">
      <svg width="28" height="28" viewBox="0 0 24 24">
        <rect width="24" height="24" rx="5" fill="#e94560" />
        <path d="M8 6L18 12L8 18Z" fill="#fff" />
      </svg>
      <div>
        <h1>YTSpoofingStream</h1>
        <div class="ver" id="hdrSub" data-i18n="hdr_ver">v0.1.6 &bull; Engine Luồng Kép Studio 774</div>
      </div>
    </div>
    <div class="lang-switch" id="langSwitch" title="Chuyển đổi ngôn ngữ / Switch language">
      <button type="button" class="lang-btn active" data-lang="vi">VI</button>
      <button type="button" class="lang-btn" data-lang="en">EN</button>
    </div>
  </div>

  <!-- MASTER ENABLE / DISABLE SECTION -->
  <div class="sec master-sec">
    <label class="row" for="en" style="cursor: pointer; margin: 0;">
      <span id="lblEnable" style="font-weight: 700; font-size: 13px; color: #fff;" data-i18n="enable_ext">Kích hoạt
        Extension</span>
      <span class="tog"><input type="checkbox" id="en" checked><span class="sl"></span></span>
    </label>
  </div>

  <!-- LIVE STATUS MONITOR SECTION (TOP PROMINENCE) -->
  <div class="sec status-card" id="statusSec">
    <div class="status-top-row">
      <div class="sec-title" data-i18n="sec_status" style="margin-bottom: 0;">Trạng thái</div>
      <div class="status-indicators">
        <span class="st-badge" id="stBadge"><span class="st-dot"></span><span id="stText" data-i18n="st_active">Hoạt
            động</span></span>
        <span class="sw-pill" id="swSt">SW: —</span>
      </div>
    </div>

    <!-- HERO AUDIO STREAM DISPLAY -->
    <div class="hero-audio-card" id="heroAudioCard">
      <div class="hero-audio-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v20M17 5v14M7 8v8M22 10v4M2 10v4" />
        </svg>
      </div>
      <div class="hero-audio-details">
        <div class="hero-audio-label" data-i18n="audio_hero_title">Chất lượng âm thanh hiện tại</div>
        <div class="hero-audio-val" id="iAudio">—</div>
        <div class="hero-audio-sub">
          <span class="method-tag" id="iMethod">—</span>
        </div>
      </div>
    </div>

    <!-- CLIENT HARVESTER MATRIX -->
    <div class="grid" id="statsGrid">
      <!-- Generated dynamically in popup.js -->
    </div>
  </div>

  <div id="mainContentWrapper">
    <!-- OPERATION MODE (INDEPENDENT SWITCHES) -->
    <div class="sec">
      <div class="sec-title" data-i18n="sec_opmode">Chế độ hoạt động</div>
      <div class="op-modes" id="opModes">
        <label class="op-mode active" data-opmode="HYBRID_HQ">
          <input type="radio" name="opmode" value="HYBRID_HQ" checked>
          <div class="op-mode-info">
            <div class="op-mode-name">
              <span data-i18n="mode_hybrid_name">Chế độ: Hybrid Mix (774 Opus ★)</span>
              <span class="op-badge hybrid" data-i18n="badge_recommended">Khuyên dùng</span>
            </div>
            <div class="op-mode-desc" data-i18n="mode_hybrid_desc">Khớp chuẩn video • Thu nhận Opus 280k+ chuẩn từ YTM &
              TV • Hủy nếu không có 774</div>
          </div>
        </label>

        <label class="op-mode" data-opmode="YTM_HARVESTER">
          <input type="radio" name="opmode" value="YTM_HARVESTER">
          <div class="op-mode-info">
            <div class="op-mode-name">
              <span data-i18n="mode_ytm_name">Chỉ thu nhận từ YTM (774 Opus ★)</span>
              <span class="op-badge ytm" data-i18n="badge_direct_hq">Trực tiếp HQ</span>
            </div>
            <div class="op-mode-desc" data-i18n="mode_ytm_desc">Khớp chuẩn video • HTTPS trực tiếp Opus 774 từ YouTube
              Music • Hủy nếu không có 774</div>
          </div>
        </label>

        <label class="op-mode" data-opmode="TV_HEADLESS">
          <input type="radio" name="opmode" value="TV_HEADLESS">
          <div class="op-mode-info">
            <div class="op-mode-name">
              <span data-i18n="mode_tv_name">Chỉ chuyển tiếp Smart TV (774 Opus ★)</span>
              <span class="op-badge tv" data-i18n="badge_tv">TV Premium</span>
            </div>
            <div class="op-mode-desc" data-i18n="mode_tv_desc">Khớp chuẩn video • Cần đăng nhập TV Premium • Chuyển tiếp
              giải mã 774 • Hủy nếu không có 774</div>
          </div>
        </label>
      </div>
    </div>

    <!-- CONTROLS -->
    <div class="sec">
      <div class="sec-title" data-i18n="sec_controls">Điều khiển</div>
      <label class="row" for="ar"><span data-i18n="ctrl_autoreload">Tự động tải lại trang khi thay đổi</span>
        <span class="tog"><input type="checkbox" id="ar" checked><span class="sl"></span></span>
      </label>
      <label class="row" for="sp"><span><span data-i18n="ctrl_stats_title">Ghi đè Thống kê chi tiết (Giả lập
            774)</span><br><span style="font-size:9px;color:var(--dim);" data-i18n="ctrl_stats_desc">Hiển thị thông số
            Opus 774 trong Thống kê chi tiết của trình phát</span></span>
        <span class="tog"><input type="checkbox" id="sp" checked><span class="sl"></span></span>
      </label>
    </div>

    <!-- ACTIONS -->
    <div class="sec">
      <div class="sec-title" data-i18n="sec_actions">Thao tác</div>
      <div class="btns">
        <button class="btn btn-p" id="btnR" data-i18n="btn_refresh">↻ Tải lại trang</button>
        <button class="btn btn-s" id="btnL" data-i18n="btn_reload">⟳ Tải lại</button>
      </div>
    </div>

    <!-- AUTHENTICATION SECTIONS -->
    <div class="sec" id="tvAuthSec">
      <div class="sec-title" data-i18n="sec_tv_auth">Đăng nhập TVHTML5</div>
      <div id="tvAuthContent">
        <div id="tvAuthStatus" style="font-size: 11px; margin-bottom: 6px; color: var(--dim);"
          data-i18n="tv_status_checking">Trạng thái: Đang kiểm tra...</div>
        <div id="tvAuthCodeContainer" style="display: none; text-align: center; margin-bottom: 8px;">
          <div style="font-size: 10px; color: var(--dim);"><span data-i18n="tv_enter_code">Nhập mã tại</span> <a
              href="https://youtube.com/activate" target="_blank" style="color: var(--accent);">youtube.com/activate</a>
          </div>
          <div id="tvAuthCode" style="font-size: 16px; font-weight: 700; letter-spacing: 2px; margin-top: 4px;"></div>
        </div>
        <div class="btns">
          <button class="btn btn-p" id="btnTvLogin" data-i18n="btn_tv_login">Đăng nhập TV</button>
          <button class="btn btn-s" id="btnTvLogout" style="display: none;" data-i18n="btn_tv_logout">Đăng xuất</button>
        </div>
      </div>
    </div>

  </div>

  <script src="popup.js"></script>
</body>

</html>
